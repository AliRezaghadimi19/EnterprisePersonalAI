# ==============================================================================
# Enterprise AI Assistant Platform - Docker Compose Configuration
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector extension for RAG Semantic Search
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise_ai_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Secr3t_Db_P@ssw0rd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_admin} -d ${POSTGRES_DB:-enterprise_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis for Session, Rate Limiting and Celery Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: enterprise_ai_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-Secr3t_Red!s_P@ssw0rd}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Secr3t_Red!s_P@ssw0rd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO (S3-compatible secure object storage for enterprise documents and files)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: enterprise_ai_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Secr3t_M!n!o_P@ssw0rd}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ai_network

  # ----------------------------------------------------------------------------
  # FastAPI Enterprise Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_ai_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_admin}:${POSTGRES_PASSWORD:-Secr3t_Db_P@ssw0rd}@postgres:5432/${POSTGRES_DB:-enterprise_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-Secr3t_Red!s_P@ssw0rd}@redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - ai_network

  # ----------------------------------------------------------------------------
  # Next.js Enterprise Frontend (RTL, Persian Vazirmatn, Jalali)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_ai_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - ai_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:

networks:
  ai_network:
    driver: bridge
