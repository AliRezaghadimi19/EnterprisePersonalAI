# ==============================================================================
# Enterprise AI Assistant Platform - Docker Compose Configuration
#
# سرویس‌ها:
#   backend  → FastAPI روی پورت 8000 (پایگاه داده SQLite سوارشده روی volume)
#   frontend → Next.js روی پورت 3000
#
# راه‌اندازی:
#   cp .env.example .env   (فقط بار اول)
#   docker compose up -d --build
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # FastAPI Enterprise Backend (SQLite via DB_PATH volume)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_ai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/enterprise_ai.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai_network

  # ----------------------------------------------------------------------------
  # Next.js Enterprise Frontend (RTL, Persian Vazirmatn, Jalali)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # آدرس API در زمان build داخل باندل فرانت تزریق می‌شود
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: enterprise_ai_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - ai_network

volumes:
  backend_data:

networks:
  ai_network:
    driver: bridge
